[project]
name = "locus"
version = "0.1.0"
description = "Personal school schedule and homework tracker"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "sqlalchemy[asyncio]>=2.0.30",
    "asyncpg>=0.29.0",
    "alembic>=1.13.0",
    "pydantic-settings>=2.4.0",
    "python-multipart>=0.0.9",
    "jinja2>=3.1.4",
    "pyjwt>=2.9.0",
    "bcrypt>=4.2.0",
    "greenlet>=3.0.0",
    "cryptography>=50.0.2",
]

[project.scripts]
locus = "locus.main:run"

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.27.0",
    "aiosqlite>=0.20.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/locus"]
