[project]
name = "locus"
version = "1.0"
description = "Self-hosted school diary: shared schedule, bell times and a collaborative homework tracker"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
authors = [{ name = "1hebread" }]
keywords = ["school", "diary", "planner", "schedule", "homework", "fastapi", "pwa", "self-hosted"]
classifiers = [
    "Environment :: Web Environment",
    "Framework :: FastAPI",
    "Intended Audience :: Education",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Education",
]
dependencies = [
    "fastapi>=0.162.2",
    "uvicorn[standard]>=0.54.0",
    "sqlalchemy[asyncio]>=2.1.6",
    "asyncpg>=0.29.0",
    "alembic>=1.20.1",
    "pydantic-settings>=2.16.2",
    "python-multipart>=0.0.33",
    "jinja2>=3.1.4",
    "pyjwt>=2.9.0",
    "bcrypt>=4.2.0",
    "greenlet>=3.0.0",
    "cryptography>=50.0.2",
    "pywebpush>=2.5.0",
]

[project.scripts]
locus = "locus.main:run"
locus-vapid = "locus.vapid:main"

[project.urls]
Homepage = "https://github.com/1hebread/Locus"
Repository = "https://github.com/1hebread/Locus"
Issues = "https://github.com/1hebread/Locus/issues"
Documentation = "https://github.com/1hebread/Locus/blob/main/docs/api.md"

[project.optional-dependencies]
dev = [
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1.post1",
    "httpx>=0.27.0",
    "aiosqlite>=0.20.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/locus"]
