services:
  - type: web
    name: locus-diary
    env: python
    region: frankfurt
    plan: free
    buildCommand: "pip install -U uv && uv pip install --system -e ."
    startCommand: "alembic upgrade head && uvicorn locus.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: ADMIN_USERNAME
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: ENVIRONMENT
        value: production
      - key: PYTHON_VERSION
        value: 3.12.8
