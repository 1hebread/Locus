<div id="hw-card-{{ hw.id }}" class="hw-card p-3.5 rounded-2xl bg-black border border-zinc-800/90 shadow-sm relative group hover:border-zinc-700 transition">
  <div class="flex items-start justify-between gap-2.5">
    <!-- Status toggle checkbox -->
    <div class="flex items-start space-x-2.5 min-w-0 flex-1">
      <button hx-post="/homework/{{ hw.id }}/toggle{% if active_subgroup %}?subgroup={{ active_subgroup }}{% endif %}"
              hx-target="closest .hw-card"
              hx-swap="outerHTML"
              hx-disabled-elt="this"
              type="button"
              data-hw-toggle
              class="mt-0.5 w-4 h-4 rounded border flex items-center justify-center shrink-0 transition
                     {% if hw.status == 'DONE' %}bg-emerald-500 border-emerald-400 text-black{% else %}border-zinc-600 hover:border-emerald-400 bg-zinc-900{% endif %}">
        {% if hw.status == 'DONE' %}
        <svg class="w-3 h-3 text-black font-extrabold" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="3.5" d="M5 13l4 4L19 7" />
        </svg>
        {% endif %}
      </button>

      <div class="min-w-0 flex-1">
        <div class="flex items-center space-x-2 mb-1 flex-wrap gap-y-1">
          <!-- Subject badge -->
          <span class="inline-flex items-center px-2 py-0.5 rounded text-[10px] font-bold text-white shadow-xs bg-emerald-500">
            {{ hw.subject.name if hw.subject else 'Предмет' }}
          </span>

          {% if hw.subgroup %}
          <span class="inline-flex items-center px-1.5 py-0.5 rounded text-[10px] font-bold text-emerald-400 bg-emerald-500/15 border border-emerald-500/25">
            {{ hw.subgroup|subgroup_badge }}
          </span>
          {% endif %}

          <!-- Due date badge -->
          {% set due_label, due_tone = hw.due_date|due_meta(today) %}
          <span class="text-[11px] font-medium ml-auto whitespace-nowrap {{ due_tone }}">
            {{ due_label }}
          </span>
        </div>

        <h4 class="text-xs sm:text-sm font-semibold text-zinc-100 leading-snug break-words {% if hw.status == 'DONE' %}hw-done-title{% endif %}">
          {{ hw.title }}
        </h4>
      </div>
    </div>

    <!-- Actions menu -->
    <div class="flex items-center space-x-1 shrink-0">
      <button hx-delete="/homework/{{ hw.id }}{% if active_subgroup %}?subgroup={{ active_subgroup }}{% endif %}"
              hx-target="closest .hw-card"
              hx-swap="outerHTML"
              hx-confirm="Удалить это задание?"
              data-hw-delete
              type="button"
              class="p-1.5 rounded text-zinc-500 hover:text-rose-400 hover:bg-zinc-800 transition"
              title="Удалить"
              aria-label="Удалить задание">
        <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" />
        </svg>
      </button>
    </div>
  </div>
</div>
{% if oob_counts is defined %}{% include "homework/hw_counts_oob.html" %}{% endif %}
