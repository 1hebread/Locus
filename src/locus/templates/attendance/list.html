<section id="attendance-list"{% if oob_list is defined and oob_list %} hx-swap-oob="outerHTML"{% endif %}
         class="rounded-2xl border border-edge/90 bg-surface-raised divide-y divide-edge/60">
  <div class="flex min-h-[50px] items-center justify-between gap-3 px-3 sm:px-4">
    <h2 class="flex min-w-0 items-center gap-2 text-sm font-bold text-fg-soft">
      Ученики
      <span class="rounded-full border border-edge bg-surface-card px-2 py-0.5 text-[10px] font-semibold text-fg-subtle">{{ day.students|length }}</span>
    </h2>
    {% include "attendance/list_actions.html" %}
  </div>
  {% for student in day.students %}
  {% include "attendance/student_row.html" %}
  {% endfor %}
</section>
{% if oob_counts is defined and oob_counts %}{% include "attendance/counts.html" %}{% endif %}
