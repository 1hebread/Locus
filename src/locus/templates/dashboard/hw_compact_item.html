{% set card_id = "mobile-hw-card-" ~ hw.id ~ "-" ~ day_num if prefix == "mobile" else ("desktop-hw-card-" ~ hw.id if prefix == "desktop" else "hw-card-" ~ hw.id) %}
<div data-hw-card="{{ hw.id }}" id="{{ card_id }}" data-copy-line="{{ hw.subject.name if hw.subject else 'Предмет' }}: {{ hw.title }}" class="flex items-center justify-between gap-2.5 text-xs text-zinc-400 font-medium">
  <div class="flex items-center gap-1 min-w-0 flex-1">
    <span class="text-emerald-400 shrink-0">
      <svg class="w-4 h-4" viewBox="0 0 24 24" fill="currentColor">
        <path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8h5z" />
      </svg>
    </span>
    <span class="truncate {% if hw.status == 'DONE' %}hw-done-title{% endif %}">
      {{ hw.title }}
    </span>
  </div>

  <button hx-post="/homework/{{ hw.id }}/toggle?view=compact{% if prefix %}&prefix={{ prefix }}{% endif %}{% if day_num %}&day_num={{ day_num }}{% endif %}"
          hx-target="closest [data-hw-card]"
          hx-swap="outerHTML"
          hx-disabled-elt="this"
          onclick="event.stopPropagation()"
          type="button"
          data-hw-toggle
          aria-label="Отметить задание"
          title="Отметить задание"
          class="w-4 h-4 rounded border flex items-center justify-center shrink-0 transition touch-manipulation
                 {% if hw.status == 'DONE' %}bg-emerald-500 border-emerald-400 text-black{% else %}border-zinc-600 hover:border-emerald-400 bg-zinc-900{% endif %}">
    {% if hw.status == 'DONE' %}
    <svg class="w-3 h-3 text-black font-extrabold" fill="none" viewBox="0 0 24 24" stroke="currentColor">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="3.5" d="M5 13l4 4L19 7" />
    </svg>
    {% endif %}
  </button>
</div>
