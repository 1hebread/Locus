{% extends "base.html" %}

{% block title %}Вход - Locus{% endblock %}

{% block content %}
<div class="min-h-[75vh] flex items-center justify-center">
  <div class="w-full max-w-sm bg-surface-raised border border-edge rounded-3xl p-6 sm:p-7 shadow-2xl">
    <div class="text-center mb-6">
      <img src="/static/icons/icon.svg?v={{ asset_version('icons/icon.svg') }}"
           alt="" aria-hidden="true"
           class="w-12 h-12 mx-auto mb-3 shadow-lg shadow-accent/10">
      <h1 class="text-xl font-bold tracking-tight text-fg">Вход в Locus</h1>
      <p class="text-xs text-fg-subtle mt-1">Школьный дневник и расписание</p>
    </div>

    {% if error %}
    <div class="mb-4 pt-2 pb-2.5 px-3.5 rounded-xl bg-danger-soft/40 border border-danger-edge/60 text-danger-ink-soft text-xs">
      {{ error }}
    </div>
    {% endif %}

    <form method="post" action="/auth/login" class="space-y-3.5">
      <div>
        <label for="username" class="block text-xs font-medium text-fg-muted mb-1">Логин</label>
        <input type="text" id="username" name="username" required maxlength="255" autocomplete="username"
               value="{{ username or '' }}"
               class="w-full bg-surface-subtle border border-edge-strong/80 rounded-xl px-3.5 py-2.5 text-sm text-fg focus:outline-none focus:ring-1 focus:ring-accent-line placeholder-fg-faint"
               placeholder="student">
      </div>

      <div>
        <label for="password" class="block text-xs font-medium text-fg-muted mb-1">Пароль</label>
        <input type="password" id="password" name="password" required autocomplete="current-password"
               class="w-full bg-surface-subtle border border-edge-strong/80 rounded-xl px-3.5 py-2.5 text-sm text-fg focus:outline-none focus:ring-1 focus:ring-accent-line placeholder-fg-faint"
               placeholder="••••••••">
      </div>

      <button type="submit"
              class="w-full mt-2 bg-accent hover:bg-accent-hover active:scale-[0.98] text-on-accent font-bold py-2.5 rounded-xl shadow-lg shadow-accent/25 transition text-sm flex items-center justify-center">
        Войти
      </button>
    </form>
  </div>
</div>
{% endblock %}
